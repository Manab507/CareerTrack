services:
  # 1. Database Service (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: careertrack-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Manab507@
      POSTGRES_DB: careertrack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d  # <--- Notun Line Add Koro

  # 2. Backend Service (FastAPI)
  backend:
    build: ./backend
    container_name: careertrack-api
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=careertrack
      - DB_USER=postgres
      - DB_PASSWORD=Manab507@
      - JWT_SECRET_KEY=amar_gopon_key
    depends_on:
      - db

volumes:
  postgres_data: